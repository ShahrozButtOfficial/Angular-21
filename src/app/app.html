<h2>Template Driven Form Signal</h2>
<input [(ngModel)]="name" (ngModelChange)="name.set($event)" placeholder="Enter Your Name" />

<br><br>

<input [(ngModel)]="email" (ngModelChange)="email.set($event)" placeholder="Enter Your Email" />

<br><br>

<button (click)="submitForm()">Submit</button>


<p>Name: {{name()}}</p>
<p>Email: {{email()}}</p>
