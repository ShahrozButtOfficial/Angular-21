<!-- <button (click)="loadUsers()">Load Users</button> -->


<h2>User From JSON server</h2>

<input type="text" placeholder="Name" [value]="name()" (input)="name.set($event.target.value)" />

<input type="email" placeholder="Email" [value]="email()" (input)="email.set($event.target.value)" />

<button (click)="submitForm()">
    {{editingUpdateID() ? 'Update User' : 'Add User'}}
</button>

<hr>


@if (users().length > 0) {
<h2>Users</h2>

<ul>
    @for (user of users(); track user.id) {
    <li>
        {{ user.name }} - {{ user.email }} 
        <strong> {{user.isActive ? 'Active':'Inactive'}}</strong>
    </li>
    <button (click)="editUser(user)">Edit User</button> | 
    <button (click)="toggleUserStatus(user)">{{user.isActive ? 'Deactivate' : 'Activate'}}</button> | 
    <button (click)="deleteUser(user)">Delete</button>
    }
</ul>
} @else {
<p>No users loaded yet.</p>
}
