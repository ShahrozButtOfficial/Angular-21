<div class="container mt-4">
  <div class="row">
    <div class="col-md-6">
      <input 
      class="form-control"
      [value]="name()"
      (input)="name.set($event.target.value)"
      type="text" 
      placeholder="Enter your name" 
      /> 
      
    </div>
    <div class="col-md-6">
      <input 
      class="form-control" 
      [value]="email()"
      (input)="email.set($event.target.value)"
      type="text" 
      placeholder="Enter your email" 
      /> 

    </div>
  </div>
  <button class="btn btn-success" (click)="submitForm()">Save User</button>
</div>
